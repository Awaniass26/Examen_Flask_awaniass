{% extends "layout/base.html" %}

{% block title %}Connexion{% endblock %}

{% block content %}
<div class="flex flex-col md:flex-row h-screen">
    <div class="md:w-1/2 hidden md:block bg-cover bg-center" style="background-image: url('/static/images/fond.jpg')">
    </div>

    <div class="w-full md:w-1/2 flex items-center justify-center bg-white">
        <form method="post" class="w-full max-w-md p-8 shadow-lg rounded bg-white">
            <h1 class="text-2xl font-bold mb-6 text-center">Bienvenue</h1>

            <p class="text-center text-sm mb-4 text-gray-600">
                Nouvel utilisateur ? 
                <a href="{{ url_for('register') }}" class="text-purple-500 hover:underline">S'inscrire</a>
            </p>

            <div class="mb-4">
                <label for="username" class="block font-semibold mb-1">Nom d'utilisateur</label>
                <input name="username" id="username" placeholder="Nom d'utilisateur" required
                       class="w-full px-4 py-2 border rounded"/>
            </div>

            <div class="mb-4">
                <label for="password" class="block font-semibold mb-1">Mot de passe</label>
                <input name="password" id="password" type="password" placeholder="Mot de passe" required
                       class="w-full px-4 py-2 border rounded "/>
            </div>

            <button type="submit"
                    class="w-full bg-purple-500 text-white py-2 rounded font-semibold">
                Se connecter
            </button>

            
        </form>
    </div>
</div>
{% endblock %}
