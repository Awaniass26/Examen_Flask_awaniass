{% extends "layout/base.html" %}

{% block title %}Inscription{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-r from-purple-200 to-white">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold text-center mb-6">Créer un compte</h1>

        <form method="post" class="space-y-5">
            <div>
                <label class="block text-sm font-medium mb-1">Nom d'utilisateur</label>
                <input 
                    type="text" 
                    name="username" 
                    required 
                    placeholder="Votre nom d'utilisateur"
                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring focus:ring-purple-300"
                />
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Mot de passe</label>
                <input 
                    type="password" 
                    name="password" 
                    required 
                    placeholder="Votre mot de passe"
                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring focus:ring-purple-300"
                />
            </div>

            <button type="submit" class="w-full bg-purple-500 hover:bg-purple-600 text-white py-2 rounded-md font-semibold">
                S'inscrire
            </button>

            <p class="text-center text-sm text-gray-600 mt-4">
                Déjà inscrit ? 
                <a href="{{ url_for('login') }}" class="text-purple-500 hover:underline">Se connecter</a>
            </p>
        </form>
    </div>
</div>
{% endblock %}
